<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%%TITLE%% — Under This Sky</title>
<meta name="description" content="The real night sky over %%PLACE%% — %%DATE_LABEL%%. Astronomically accurate, interactive.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="sky.css">
</head>
<body>
<div class="page">
  <header class="keep">
    <div class="rule" aria-hidden="true"></div>
    <h1>%%TITLE%%</h1>
    <div class="occasion">%%SUBTITLE%%</div>
    <div class="whereline">
      <span>%%PLACE%%</span>
      <span class="sep" aria-hidden="true">·</span>
      <span id="when">%%DATE_LABEL%%</span>
    </div>
  </header>

  <div class="stage">
    <div class="skywrap">
      <canvas id="sky" aria-label="Interactive star chart"></canvas>
      <div id="tip" role="status"></div>
    </div>
  </div>

  <div class="bar">
    <button id="labelsbtn" class="ctl" type="button" aria-pressed="false">Names</button>
    <input id="time" type="range" min="%%T_MIN%%" max="%%T_MAX%%" step="5" value="0"
           aria-label="Time of night">
    <div class="clock" id="tlabel"></div>
  </div>
  <p class="hint">Drag to pan &middot; pinch to zoom &middot; tap a star</p>

  <section class="details">
    <h2 class="eyebrow">That night&rsquo;s sky</h2>
    <div id="strip" class="strip" aria-label="That night's sky"></div>
    <div id="stripnote" class="stripnote" role="status"></div>
  </section>

  <section class="plate">
    <div class="coords">%%COORDS%%</div>
    <div class="events">%%EVENTS%%</div>
  </section>

  <footer>
    <button id="copybtn" class="ctl ghost" type="button">Copy link to this sky</button>
    <div class="prov">every star drawn from real catalogs &middot; JPL ephemerides</div>
    <div class="brand">made by
      <a href="https://nightshiftastroco.etsy.com" rel="noopener">Night Shift Astro Co.</a>
      &middot; <a href="https://underthissky.net">underthissky.net</a>
    </div>
  </footer>
</div>
<script>window.SKY = %%DATA%%;</script>
<script src="projection.js"></script>
<script src="sky.js"></script>
</body>
</html>
